name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Go Tests & Race Detector
        run: |
          go test -race ./... -count=1

      - name: Run Go Vet
        run: |
          go vet ./...

      - name: Test Panel Session Adapter
        run: |
          node scripts/test_panel_auth.cjs
          node scripts/test_panel_config.cjs

      - name: Build C-Shared Library
        run: |
          CGO_ENABLED=1 go build -buildmode=c-shared -o build/factory.so ./cmd/factory
